name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --console --name EmojiTamagotchi --collect-all pygame tamagotchi.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EmojiTamagotchi-EXE
          path: dist/EmojiTamagotchi.exe
